
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="rcp.css" />
</head>
<body>
  <div class="heading">ROCK PAPER SCISSORS</div>

  <div class="choices">
    <div class="choicediv">
      <div class="stone"><img id="img1" src="stone.jpeg" alt="Stone"></div>
      <div class="paper"><img id="img2" src="paper.jpeg" alt="Paper"></div>
      <div class="scissor"><img id="img3" src="scissor.jpeg" alt="Scissor"></div>
    </div>
  </div>

  <div class="scores">
    <div class="user">
      <p id="user-score">0</p>
      <p>User</p>
    </div>
    <div class="computer">
      <p id="computer-score">0</p>
      <p>Computer</p>
    </div>
  </div>

  <div class="results">
    <p id="result">Play your move</p>
  </div>

  <script src="rcp1.js"></script>
</body>
</html>
